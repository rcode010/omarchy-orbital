name: Checks

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null
      - name: Test persistence and reports
        run: PYTHONDONTWRITEBYTECODE=1 python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Test display model
        run: node tests/timer_display.test.js
